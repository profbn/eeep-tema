<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <path id="textPathTop" d="M 68,250 A 182,182 0 1,1 432,250" fill="none"/>
    <path id="textPathBottom" d="M 432,250 A 182,182 0 0,1 68,250" fill="none"/>
    <g id="star">
      <polygon points="0,-11 3.2,-3.5 10.4,-3.5 4.6,0.8 6.8,8.2 0,3.8 -6.8,8.2 -4.6,0.8 -10.4,-3.5 -3.2,-3.5" fill="#ffffff"/>
    </g>
  </defs>

  <!-- Anel Externo Verde -->
  <circle cx="250" cy="250" r="240" fill="#00a012" />
  <circle cx="250" cy="250" r="236" fill="none" stroke="#ffffff" stroke-width="4" />
  
  <!-- Anel Divisório Interno -->
  <circle cx="250" cy="250" r="182" fill="none" stroke="#ffffff" stroke-width="5" />
  <circle cx="250" cy="250" r="176" fill="#ffffff" />
  <circle cx="250" cy="250" r="172" fill="#00a012" />

  <!-- Texto Superior -->
  <text fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="31" letter-spacing="2.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">EEEP PROFESSOR ANTONIO</textPath>
  </text>

  <!-- Texto Inferior -->
  <text fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="33" letter-spacing="3">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">VALMIR DA SILVA</textPath>
  </text>

  <!-- Estrelas Esquerdas -->
  <use href="#star" transform="translate(37, 212) scale(1.3) rotate(-15)"/>
  <use href="#star" transform="translate(31, 250) scale(1.3)"/>
  <use href="#star" transform="translate(37, 288) scale(1.3) rotate(15)"/>

  <!-- Estrelas Direitas -->
  <use href="#star" transform="translate(463, 212) scale(1.3) rotate(15)"/>
  <use href="#star" transform="translate(469, 250) scale(1.3)"/>
  <use href="#star" transform="translate(463, 288) scale(1.3) rotate(-15)"/>

  <!-- Coroa Mural (Muro Fortificado) -->
  <path d="M 175,108 L 325,108 L 320,80 L 305,80 L 305,88 L 285,88 L 285,80 L 265,80 L 265,88 L 235,88 L 235,80 L 215,80 L 215,88 L 195,88 L 195,80 L 180,80 Z" fill="#00a012" stroke="#ffffff" stroke-width="2"/>

  <!-- Brasão Central -->
  <g transform="translate(0, 20)">
    <path d="M 130,135 Q 250,130 370,135 C 385,190 380,260 355,300 C 320,355 250,395 250,395 C 250,395 180,355 145,300 C 120,260 115,190 130,135 Z" fill="#ffffff" stroke="#00a012" stroke-width="6"/>
    
    <path d="M 136,141 Q 250,136 364,141 C 378,193 373,258 350,296 C 317,349 250,387 250,387 C 250,387 183,349 150,296 C 127,258 122,193 136,141 Z" fill="#ffffff"/>

    <clipPath id="shield-clip">
      <path d="M 136,141 Q 250,136 364,141 C 378,193 373,258 350,296 C 317,349 250,387 250,387 C 250,387 183,349 150,296 C 127,258 122,193 136,141 Z"/>
    </clipPath>

    <g clip-path="url(#shield-clip)">
      <!-- Quadrante Superior Esquerdo (Código) -->
      <rect x="110" y="130" width="140" height="95" fill="#00a012"/>
      <!-- Quadrante Superior Direito (Esquadro e Compasso) -->
      <rect x="250" y="130" width="140" height="95" fill="#00a012"/>

      <!-- Divisórias do Brasão -->
      <line x1="250" y1="130" x2="250" y2="395" stroke="#ffffff" stroke-width="4"/>
      <line x1="110" y1="225" x2="390" y2="225" stroke="#00a012" stroke-width="4"/>
      <line x1="110" y1="310" x2="390" y2="310" stroke="#00a012" stroke-width="4"/>

      <!-- Ícone 1: Código/Desenvolvimento -->
      <g transform="translate(195, 178) scale(0.9)">
        <path d="M -30,0 L -12,-18 L -4,-18 L -22,0 L -4,18 L -12,18 Z" fill="#ffffff"/>
        <path d="M 30,0 L 12,-18 L 4,-18 L 22,0 L 4,18 L 12,18 Z" fill="#ffffff"/>
        <polygon points="0,-18 -12,0 0,18 12,0" fill="#ffffff"/>
      </g>

      <!-- Ícone 2: Edificações (Esquadro e Compasso) -->
      <g transform="translate(305, 178) scale(0.85)">
        <path d="M -25,12 L 20,-22 L 28,-14 L -17,20 L 25,20 L 25,28 L -25,28 Z" fill="#ffffff" opacity="0.9"/>
        <circle cx="0" cy="-22" r="6" fill="#ffffff"/>
        <path d="M -2,-20 L -22,25 L -14,25 L 0,-14 L 14,25 L 22,25 L 2,-20 Z" fill="#ffffff"/>
        <line x1="-15" y1="8" x2="15" y2="8" stroke="#00a012" stroke-width="3"/>
      </g>

      <!-- Ícone 3: Logística (Globo e Engrenagens) -->
      <g transform="translate(195, 268) scale(0.75)">
        <circle cx="-10" cy="-8" r="22" fill="none" stroke="#00a012" stroke-width="3"/>
        <ellipse cx="-10" cy="-8" rx="10" ry="22" fill="none" stroke="#00a012" stroke-width="2"/>
        <line x1="-32" y1="-8" x2="12" y2="-8" stroke="#00a012" stroke-width="2"/>
        <path d="M -30,-18 C -20,-35 10,-30 15,-12" fill="none" stroke="#00a012" stroke-width="4"/>
        <polygon points="18,-10 8,-16 18,-22" fill="#00a012"/>
        <circle cx="12" cy="12" r="10" fill="none" stroke="#00a012" stroke-width="4" stroke-dasharray="4 3"/>
      </g>

      <!-- Ícone 4: Eletromecânica (Raio e Engrenagem) -->
      <g transform="translate(305, 268) scale(0.75)">
        <circle cx="0" cy="0" r="20" fill="none" stroke="#00a012" stroke-width="6" stroke-dasharray="7 4"/>
        <circle cx="0" cy="0" r="10" fill="#ffffff"/>
        <path d="M -28,12 L 0,-6 L -4,-2 L 28,-16 L 2,2 L 6,-2 Z" fill="#00a012"/>
      </g>

      <!-- Ícone 5: Informática (Laptop e Engrenagem) -->
      <g transform="translate(250, 345) scale(0.75)">
        <rect x="-24" y="-20" width="48" height="30" rx="3" fill="none" stroke="#00a012" stroke-width="3"/>
        <path d="M -32,10 L 32,10 L 26,16 L -26,16 Z" fill="#00a012"/>
        <circle cx="-8" cy="-5" r="5" fill="none" stroke="#00a012" stroke-width="2" stroke-dasharray="2 2"/>
        <path d="M 6,-10 L 14,-5 L 6,0" fill="none" stroke="#00a012" stroke-width="2"/>
      </g>
    </g>

    <path d="M 142,147 Q 250,142 358,147 C 371,195 366,254 345,290 C 314,340 250,377 250,377 C 250,377 186,340 155,290 C 134,254 129,195 142,147 Z" fill="none" stroke="#00a012" stroke-width="3"/>
  </g>
</svg>
